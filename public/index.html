<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Feriensuche</title>
<style>
  :root {
    --bg: #E4D6B6;
    --card: #FBF5E7;
    --ink: #242018;
    --accent: #B8842E;
    --accent-dark: #8C6320;
    --stamp: #9A3B2B;
    --line: #B7A379;
    --faint: #8A7A57;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    padding-bottom: 60px;
  }
  header { border-bottom: 2px solid var(--ink); padding: 24px 16px 16px; }
  h1 { font-size: 24px; margin: 0; text-transform: uppercase; }
  .subtitle { color: var(--faint); font-size: 12px; margin-top: 4px; }
  form {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    padding: 16px;
  }
  form label { font-size: 12px; color: var(--faint); display: block; margin-bottom: 4px; }
  form input {
    width: 100%; padding: 10px 12px; border-radius: 3px;
    border: 1.5px solid var(--line); background: var(--card); color: var(--ink); font-size: 14px; outline: none;
  }
  .field-place { grid-column: 1 / -1; }
  .field-wide { grid-column: 1 / -1; }
  .hint { grid-column: 1 / -1; font-size: 11px; color: var(--faint); margin-top: -6px; }
  .btn {
    grid-column: 1 / -1;
    padding: 12px 14px; border-radius: 3px; font-size: 13px; font-weight: 700; text-transform: uppercase;
    cursor: pointer; border: none; background: var(--accent); color: var(--card);
  }
  .btn:disabled { opacity: 0.6; cursor: default; }
  .banner { margin: 0 16px 16px; padding: 10px 14px; font-size: 13px; border-radius: 3px; }
  .banner.error { background: #F3E3D8; color: var(--stamp); }
  .banner.info { background: #EFEADA; color: var(--faint); }
  .results { padding: 0 16px; display: grid; gap: 10px; }
  .card {
    background: var(--card); border: 1.5px solid var(--line); border-radius: 4px; padding: 14px;
  }
  .card h3 { margin: 0 0 6px; font-size: 15px; }
  .card .meta { font-size: 12px; color: var(--faint); }
  .card .price { margin-top: 8px; font-size: 16px; font-weight: 700; color: var(--accent-dark); }
</style>
</head>
<body>
<header>
  <h1>Feriensuche</h1>
  <div class="subtitle">Echte Verfügbarkeit für deinen Zeitraum – keine Schätzung</div>
</header>

<form id="search-form">
  <div>
    <label for="country">Land</label>
    <input id="country" name="country" placeholder="z. B. Deutschland" required>
  </div>
  <div>
    <label for="city">Stadt</label>
    <input id="city" name="city" placeholder="z. B. Berlin" required>
  </div>
  <div>
    <label for="checkIn">Anreise</label>
    <input id="checkIn" name="checkIn" type="date" required>
  </div>
  <div>
    <label for="checkOut">Abreise</label>
    <input id="checkOut" name="checkOut" type="date" required>
  </div>
  <div>
    <label for="adults">Erwachsene</label>
    <input id="adults" name="adults" type="number" min="1" value="2" required>
  </div>
  <div>
    <label for="children">Kinder</label>
    <input id="children" name="children" type="number" min="0" value="2">
  </div>
  <div class="field-wide" id="childAges-field" style="display:none">
    <label for="childAges">Alter der Kinder (kommagetrennt)</label>
    <input id="childAges" name="childAges" placeholder="z. B. 5, 8" value="12, 15">
  </div>
  <div class="field-wide">
    <label><input type="checkbox" id="extraAdult" style="width:auto; margin-right:6px;">+ 1 Erwachsener (18 Jahre) kommt dazu</label>
  </div>
  <div>
    <label for="rooms">Zimmer</label>
    <input id="rooms" name="rooms" type="number" min="1" value="1">
  </div>
  <div>
    <label for="maxBudget">Max. Budget (gesamter Aufenthalt)</label>
    <input id="maxBudget" name="maxBudget" type="number" min="0" placeholder="optional">
  </div>
  <div class="hint">Budget filtert nur die angezeigten Ergebnisse und vergleicht Preise unabhängig von der Währung – bei Anbietern mit mehreren Plattformen können unterschiedliche Währungen auftauchen.</div>
  <button class="btn" type="submit" id="submit-btn">Verfügbarkeit prüfen</button>
</form>

<div id="banner"></div>
<div class="results" id="results"></div>

<script>
const form = document.getElementById('search-form');
const banner = document.getElementById('banner');
const results = document.getElementById('results');
const submitBtn = document.getElementById('submit-btn');
const childrenInput = document.getElementById('children');
const childAgesField = document.getElementById('childAges-field');
const childAgesInput = document.getElementById('childAges');
const adultsInput = document.getElementById('adults');
const extraAdultCheckbox = document.getElementById('extraAdult');

function toggleChildAges() {
  const show = Number(childrenInput.value) > 0;
  childAgesField.style.display = show ? '' : 'none';
  childAgesInput.required = show;
}
childrenInput.addEventListener('input', toggleChildAges);
toggleChildAges();

extraAdultCheckbox.addEventListener('change', () => {
  const delta = extraAdultCheckbox.checked ? 1 : -1;
  adultsInput.value = Math.max(1, Number(adultsInput.value) + delta);
});

function showBanner(message, type) {
  banner.innerHTML = message ? `<div class="banner ${type}">${message}</div>` : '';
}

function renderResults(data, maxBudget) {
  results.innerHTML = '';
  let list = data.results;
  let filteredOut = 0;
  if (maxBudget) {
    const before = list.length;
    list = list.filter((item) => item.price == null || Number(item.price) <= maxBudget);
    filteredOut = before - list.length;
  }

  if (!list.length) {
    showBanner(`Keine verfügbaren Unterkünfte in ${data.place} für diesen Zeitraum gefunden${maxBudget ? ' innerhalb des Budgets' : ''}. (Quelle: ${data.provider})`, 'info');
    return;
  }

  const budgetNote = filteredOut ? ` · ${filteredOut} über Budget ausgeblendet` : '';
  showBanner(`${list.length} verfügbare Unterkünfte in ${data.place} · Quelle: ${data.provider}${budgetNote}`, 'info');
  for (const item of list) {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <h3>${item.name}</h3>
      <div class="meta">${item.checkInDate} – ${item.checkOutDate} · ${item.source}</div>
      <div class="price">${item.price ?? '?'} ${item.currency ?? ''}</div>
    `;
    results.appendChild(card);
  }
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  showBanner('', '');
  results.innerHTML = '';

  const childrenCount = Number(form.children.value) || 0;
  const childAges = childAgesInput.value.split(',').map((s) => s.trim()).filter(Boolean);
  if (childrenCount > 0 && childAges.length !== childrenCount) {
    showBanner('Bitte für jedes Kind ein Alter angeben (kommagetrennt).', 'error');
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = 'Suche läuft…';

  const params = new URLSearchParams({
    country: form.country.value,
    city: form.city.value,
    checkIn: form.checkIn.value,
    checkOut: form.checkOut.value,
    adults: form.adults.value,
    children: childrenCount,
    rooms: form.rooms.value,
  });
  if (childrenCount > 0) {
    params.set('childAges', childAges.join(','));
  }

  const maxBudget = form.maxBudget.value ? Number(form.maxBudget.value) : null;

  try {
    const res = await fetch(`/api/search?${params}`);
    const data = await res.json();
    if (!res.ok) {
      showBanner(data.error || 'Unbekannter Fehler', 'error');
    } else {
      renderResults(data, maxBudget);
    }
  } catch (err) {
    showBanner('Verbindung zum Server fehlgeschlagen.', 'error');
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Verfügbarkeit prüfen';
  }
});
</script>
</body>
</html>
